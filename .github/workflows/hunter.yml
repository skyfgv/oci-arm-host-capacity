name: Oracle Cloud Instance Hunter

on:
  push:
    branches: [ main, master ]
  schedule:
    # Corre automaticamente de 15 em 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permite-te carregar num botão para correr o robô manualmente sempre que quiseres

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: curl, mbstring, openssl

    - name: Install Dependencies
      run: composer install

    - name: Create Private Key File
      run: |
        echo "${{ secrets.OCI_PRIVATE_KEY_TEXT }}" > oracle_private_key.pem
        chmod 600 oracle_private_key.pem

    - name: Run Instance Hunter
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_PRIVATE_KEY_FILENAME: 'oracle_private_key.pem'
        OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        OCI_SHAPE: 'VM.Standard.A1.Flex'
        OCI_OCPUS: 4
        OCI_MEMORY_IN_GBS: 24
        OCI_BOOT_VOLUME_SIZE_IN_GBS: 50
        OCI_MAX_INSTANCES: 1
      run: php index.php
